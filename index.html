<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Handwritten Text Composer</title>
    <style>
        :root {
            --panel-bg: #f7fafc;
            --accent: #2563eb;
            --muted: #6b7280;
            --card: #ffffff;
            --radius: 10px;
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        }

        body {
            margin: 0;
            background: linear-gradient(180deg, #eef2ff 0%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 28px;
            box-sizing: border-box;
            color: #111827;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 20px;
        }

        .panel {
            background: var(--panel-bg);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: 0 6px 18px rgba(16, 24, 40, 0.06);
        }

        h1 {
            font-size: 18px;
            margin: 0 0 10px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        small {
            color: var(--muted);
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
        }

        label {
            display: block;
            font-size: 13px;
            margin-top: 12px;
            color: #0f172a;
        }

        input[type="file"] {
            display: block;
            margin-top: 8px;
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 8px;
        }

        .row>* {
            flex: 1;
        }

        .small {
            font-size: 13px;
            color: var(--muted);
        }

        .control {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 10px;
        }

        .control input[type="range"] {
            width: 100%;
        }

        .control .val {
            width: 60px;
            text-align: right;
            font-size: 13px;
            color: var(--muted);
        }

        .btn {
            display: inline-block;
            background: var(--accent);
            color: white;
            border-radius: 8px;
            padding: 8px 12px;
            text-decoration: none;
            cursor: pointer;
            border: none;
            font-weight: 600;
        }

        .btn.secondary {
            background: transparent;
            border: 1px solid #e6edf8;
            color: #0f172a;
            font-weight: 600;
        }

        .canvas-wrap {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: 0 8px 30px rgba(2, 6, 23, 0.06);
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 480px;
        }

        .canvas-area {
            border: 1px dashed #e6eefc;
            border-radius: 8px;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #fff 0%, #fbfdff 100%);
            padding: 10px;
        }

        canvas {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .note {
            font-size: 13px;
            color: var(--muted);
        }

        .footer-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 10px;
        }

        @media (max-width:980px) {
            .container {
                grid-template-columns: 1fr;
                padding-bottom: 40px;
            }
        }
    </style>

</head>

<body>
    <div class="container">
        <aside class="panel" aria-labelledby="title">
            <h1 id="title">✍️ Handwritten Text Composer</h1>
            <small>Upload handwriting fonts and a base image. Every character can use a random font.</small>

            <!-- MULTIPLE FONT UPLOAD -->
            <label>1) Upload handwriting fonts (.otf / .ttf) — multiple supported</label>
            <input id="fontFile" type="file" accept=".otf,.ttf,font/otf,font/ttf" multiple />

            <label>2) Upload base image (PNG / JPEG)</label>
            <input id="imageFile" type="file" accept="image/png, image/jpeg" />

            <label for="text">Text</label>
            <textarea id="text" rows="6"
                style="width:100%; padding:8px; border-radius:8px; border:1px solid #e6eefc; resize:vertical;"
                placeholder="Type your text here."></textarea>

            <label>Font size</label>
            <div class="control">
                <input id="fontSize" type="range" min="12" max="120" value="36" />
                <div class="val" id="fontSizeVal">36px</div>
            </div>

            <label>Line height</label>
            <div class="control">
                <input id="lineHeight" type="range" min="0.8" max="2.2" step="0.01" value="1.2" />
                <div class="val" id="lineHeightVal">1.20</div>
            </div>

            <label>Text color</label>
            <div class="row">
                <input id="textColor" type="color" value="#222222" />
                <input id="opacity" type="range" min="0.1" max="1" step="0.01" value="1" />
            </div>

            <label>X offset (px)</label>
            <div class="control">
                <input id="xOffset" type="range" min="-1000" max="1000" value="40" />
                <div class="val" id="xOffsetVal">40</div>
            </div>

            <label>Y offset (px)</label>
            <div class="control">
                <input id="yOffset" type="range" min="-1000" max="1000" value="40" />
                <div class="val" id="yOffsetVal">40</div>
            </div>

            <label>Maximum text width (% of canvas)</label>
            <div class="control">
                <input id="maxWidthPct" type="range" min="10" max="100" value="80" />
                <div class="val" id="maxWidthPctVal">80%</div>
            </div>

            <label>Letter position jitter (px)</label>
            <div class="control">
                <input id="jitterPos" type="range" min="0" max="4" step="0.1" value="2.5" />
                <div class="val" id="jitterPosVal">2.5px</div>
            </div>

            <label>Letter size jitter (px)</label>
            <div class="control">
                <input id="jitterSize" type="range" min="0" max="10" step="0.1" value="5" />
                <div class="val" id="jitterSizeVal">5px</div>
            </div>

            <label>Letter angle jitter (degrees)</label>
            <div class="control">
                <input id="jitterAngle" type="range" min="0" max="5" step="0.1" value="2.2" />
                <div class="val" id="jitterAngleVal">2.2°</div>
            </div>

            <label>Line X-jitter (px)</label>
            <div class="control">
                <input id="lineJitterX" type="range" min="0" max="40" step="0.5" value="22" />
                <div class="val" id="lineJitterXVal">22px</div>
            </div>

            <label>Line Y-jitter (px)</label>
            <div class="control">
                <input id="lineJitterY" type="range" min="0" max="20" step="0.5" value="7" />
                <div class="val" id="lineJitterYVal">7px</div>
            </div>

            <div class="footer-row">
                <button id="renderBtn" class="btn">Re-render</button>
                <button id="downloadBtn" class="btn secondary">Download PNG</button>
            </div>
        </aside>

        <main class="canvas-wrap panel">
            <div style="display:flex; align-items:center; justify-content:space-between;">
                <strong>Preview</strong>
                <span class="note" id="metaNote">No image loaded</span>
            </div>
            <div class="canvas-area" id="canvasArea">
                <canvas id="mainCanvas" width="800" height="600" style="background:transparent;"></canvas>
            </div>
            <div style="display:flex; gap:10px; align-items:center; justify-content:space-between;">
                <button id="fitBtn" class="btn secondary">Fit to screen</button>
            </div>
        </main>

    </div>

    <script>
        (function () {

            // Elements
            const fontFile = document.getElementById('fontFile');
            const imageFile = document.getElementById('imageFile');
            const textArea = document.getElementById('text');
            const fontSize = document.getElementById('fontSize');
            const fontSizeVal = document.getElementById('fontSizeVal');
            const lineHeight = document.getElementById('lineHeight');
            const lineHeightVal = document.getElementById('lineHeightVal');
            const textColor = document.getElementById('textColor');
            const opacity = document.getElementById('opacity');
            const xOffset = document.getElementById('xOffset');
            const xOffsetVal = document.getElementById('xOffsetVal');
            const yOffset = document.getElementById('yOffset');
            const yOffsetVal = document.getElementById('yOffsetVal');
            const maxWidthPct = document.getElementById('maxWidthPct');
            const maxWidthPctVal = document.getElementById('maxWidthPctVal');
            const renderBtn = document.getElementById('renderBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const mainCanvas = document.getElementById('mainCanvas');
            const ctx = mainCanvas.getContext('2d', { alpha: true });
            const metaNote = document.getElementById('metaNote');
            const fitBtn = document.getElementById('fitBtn');
            const jitterPos = document.getElementById('jitterPos');
            const jitterPosVal = document.getElementById('jitterPosVal');
            const jitterSize = document.getElementById('jitterSize');
            const jitterSizeVal = document.getElementById('jitterSizeVal');
            const jitterAngle = document.getElementById('jitterAngle');
            const jitterAngleVal = document.getElementById('jitterAngleVal');
            const lineJitterX = document.getElementById('lineJitterX');
            const lineJitterXVal = document.getElementById('lineJitterXVal');
            const lineJitterY = document.getElementById('lineJitterY');
            const lineJitterYVal = document.getElementById('lineJitterYVal');

            // NEW: store multiple fonts here
            let loadedFonts = [];
            let baseImage = null;
            let baseImageURL = null;

            loadDefaultBaseImage();

            function detectFontFormat(filename) {
                filename = filename.toLowerCase();
                if (filename.endsWith(".otf")) return "opentype";
                if (filename.endsWith(".ttf")) return "truetype";
                if (filename.endsWith(".woff")) return "woff";
                if (filename.endsWith(".woff2")) return "woff2";
                return "opentype";
            }

            async function installMultipleFonts(files) {

                for (const file of files) {

                    const blobURL = URL.createObjectURL(file);
                    const fontName = "UserFont_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
                    const format = detectFontFormat(file.name);
                    const src = `url('${blobURL}') format('${format}')`;

                    try {
                        const ff = new FontFace(fontName, src);
                        await ff.load();
                        document.fonts.add(ff);
                        loadedFonts.push(fontName);
                    } catch {
                        // fallback
                        let style = document.getElementById("dynamic-font-style");
                        if (!style) {
                            style = document.createElement("style");
                            style.id = "dynamic-font-style";
                            document.head.appendChild(style);
                        }

                        style.textContent += `
@font-face {
  font-family: '${fontName}';
  src: ${src};
}
`;
                        await document.fonts.load(`12px '${fontName}'`);
                        loadedFonts.push(fontName);
                    }
                }
            }

            function installBaseImageFromFile(file) {
                return new Promise((resolve, reject) => {
                    const url = URL.createObjectURL(file);
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.onload = () => {
                        baseImage = img;
                        mainCanvas.width = img.naturalWidth;
                        mainCanvas.height = img.naturalHeight;
                        metaNote.textContent = `Image: ${img.naturalWidth}×${img.naturalHeight}`;
                        resolve(img);
                    };
                    img.onerror = reject;
                    img.src = url;
                    baseImageURL = url;
                });
            }

            function loadDefaultBaseImage() {
                const img = new Image();
                img.src = "base.jpeg"; // or base.png — either is fine
                img.crossOrigin = "anonymous";

                img.onload = function () {
                    baseImage = img;
                    mainCanvas.width = img.naturalWidth;
                    mainCanvas.height = img.naturalHeight;
                    metaNote.textContent = `Default base loaded (${img.naturalWidth}×${img.naturalHeight})`;

                    render();
                    fitCanvasToScreen();
                };

                img.onerror = function () {
                    console.warn("Default base image could not be loaded.");
                };
            }

            function wrapText(ctx, text, maxdth) {
                const lines = [];
                const paragraphs = text.split("\n");

                for (const para of paragraphs) {
                    if (para.trim() === "") {
                        lines.push("");
                        continue;
                    }

                    const words = para.split(/\s+/);
                    let line = "";

                    for (let w of words) {
                        const testLine = line ? line + " " + w : w;
                        const width = ctx.measureText(testLine).width;

                        if (width > maxWidth && line) {
                            lines.push(line);
                            line = w;
                        } else {
                            line = testLine;
                        }
                    }

                    lines.push(line);
                }

                return lines;
            }

            async function render() {

                if (!baseImage) {
                    ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
                    return;
                }

                ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
                ctx.drawImage(baseImage, 0, 0, mainCanvas.width, mainCanvas.height);

                const fSize = parseFloat(fontSize.value);
                const lh = parseFloat(lineHeight.value);
                const xOff = parseFloat(xOffset.value);
                const yOff = parseFloat(yOffset.value);
                const maxWidth = (parseFloat(maxWidthPct.value) / 100) * mainCanvas.width;

                ctx.fillStyle = textColor.value;
                ctx.globalAlpha = parseFloat(opacity.value);
                ctx.textBaseline = "alphabetic";

                ctx.font = `${fSize}px sans-serif`;

                const rawText = textArea.value;
                const lines = wrapText(ctx, rawText, maxWidth);

                let y = yOff + fSize;

                for (let line of lines) {

                    const lineXJ = (Math.random() - 0.5) * parseFloat(lineJitterX.value);
                    const lineYJ = (Math.random() - 0.5) * parseFloat(lineJitterY.value);

                    let x = xOff + lineXJ;
                    let yActual = y + lineYJ;
                    let accumulatedY = 0;

                    for (let ch of line) {

                        const posJ = (Math.random() - 0.5) * parseFloat(jitterPos.value);
                        const sizeJ = (Math.random() - 0.5) * parseFloat(jitterSize.value);
                        const angle = (Math.random() - 0.5) * parseFloat(jitterAngle.value) * Math.PI / 180;
                        const yCharJ = (Math.random() - 0.5) * (parseFloat(jitterPos.value) / 6);
                        accumulatedY += yCharJ;

                        // pick a random font
                        const chosenFont = loadedFonts.length
                            ? loadedFonts[Math.floor(Math.random() * loadedFonts.length)]
                            : "sans-serif";

                        ctx.save();
                        ctx.font = `${fSize + sizeJ}px '${chosenFont}', sans-serif`;
                        ctx.translate(x, yActual + accumulatedY);
                        ctx.rotate(angle);
                        ctx.fillText(ch, 0, 0);
                        const w = ctx.measureText(ch).width;
                        ctx.restore();

                        x += w + posJ;
                    }

                    y += fSize * lh;
                }
            }

            function downloadPNG() {
                const link = document.createElement("a");
                link.href = mainCanvas.toDataURL("image/png");
                link.download = "handwriting.png";
                link.click();
            }

            function fitCanvasToScreen() {
                mainCanvas.style.maxWidth = "100%";
                mainCanvas.style.height = "auto";
            }

            // === EVENT LISTENERS ===

            fontFile.addEventListener("change", async (e) => {
                const files = Array.from(e.target.files || []);
                if (!files.length) return;

                await installMultipleFonts(files);
                metaNote.textContent = `Loaded ${loadedFonts.length} font(s)`;
                render();
            });

            imageFile.addEventListener("change", (e) => {
                const file = e.target.files[0];
                if (!file) return;
                installBaseImageFromFile(file).then(() => render());
            });

            [
                fontSize, lineHeight, textColor, opacity,
                xOffset, yOffset, maxWidthPct,
                jitterPos, jitterSize, jitterAngle,
                lineJitterX, lineJitterY
            ].forEach(el => el.addEventListener("input", () => render()));

            textArea.addEventListener("input", () => setTimeout(render, 400));

            renderBtn.addEventListener("click", render);
            downloadBtn.addEventListener("click", downloadPNG);
            fitBtn.addEventListener("click", fitCanvasToScreen);

        })();
    </script>
</body>

</html>
